<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    
    <link rel="stylesheet" type="text/css" href="{% static 'main/style.css' %}">
    <title>RouteAble Map</title>
</head>

{% block content %}
<body>
    <div class="menubox">
        <div class="logo">RouteAble</div>
        <ul class="menu">
            <li><a href="/">Home</a></li>
            <li><a href="/talk_People/">Community</a></li>
            <li><a href="/map/">Map</a></li>
            <li><a href="/Help_People/">Help</a></li>
            <li><a href="/Contact_People/">Contact</a></li>
        </ul>
    </div>

    <div class="map-layout-container">
        
        <div class="sidebar-panel" id="info-panel">
            <h3>Информация об объекте</h3>
            <div id="info-content" class="info-panel-content">
                <p class="info-panel-placeholder">
                    Выберите маркер на карте, чтобы увидеть информацию о доме.
                </p>
            </div>
        </div>
        
        <div id="map"></div>

        <div class="sidebar-panel">
            <h3 id="form-title">Добавить дом</h3>
            <form method="post">
                {% csrf_token %}
                
                <input type="hidden" id="sidebar-id" name="house_id" value="">
                <input type="hidden" id="sidebar-lat" name="latitude" value="" required>
                <input type="hidden" id="sidebar-lng" name="longitude" value="" required>
                
                <div class="django-sidebar-form">
                    {{ form }}  </div>
                
                <input type="submit" value="Сохранить" class="submit-btn">
            </form>
        </div>

    </div>

    <script>
        // 1. Инициализация карты
        var map = L.map('map').setView([55.030206, 82.920419], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var currentMarker = null;

        var latInput = document.getElementById('sidebar-lat');
        var lngInput = document.getElementById('sidebar-lng');
        var infoContent = document.getElementById('info-content');

        // =================================================================
        // ВЫВОД МАРКЕРОВ ИЗ БАЗЫ С ДЕЙСТВИЕМ ПРИ КЛИКЕ
        // =================================================================
        {% for house in houses %}
            {% if house.latitude and house.longitude %}
                (function() {
                    var marker = L.marker([{{ house.latitude }}, {{ house.longitude }}]).addTo(map);
                    
                    marker.on('click', function() {
                        // Сохраняем значения из Django в обычные JS-переменные
                        var city = "{{ house.city.name|default:'' }}";
                        var street = "{{ house.street|default:'' }}";
                        var number = "{{ house.number|default:'' }}";
                        var floors = "{{ house.floors|default:'' }}";
                        var elevatorCondition = "{{ house.elevator.condition|default:'' }}";
                        var elevatorWidth = "{{ house.elevator.size_width|default:'0' }}";
                        var elevatorLength = "{{ house.elevator.size_length|default:'0' }}";
                        
                        // Получаем строковое описание пандуса через __str__ вашей модели Ramps
                        var rampsText = "{{ house.ramps|default:'' }}"; 
                        var rampsDegrees = "{{ house.ramps.degrees|default:'0' }}";
                        var rampsLength = "{{ house.ramps.length|default:'0' }}";
                        var rampsType = "{{ house.ramps.type|default:'Неизвестно' }}";

                        // Формируем базовый HTML-шаблон для левой панели информации
                        var html = `
                            <div class="info-item"><strong>Город:</strong> ${city}</div>
                            <div class="info-item"><strong>Улица:</strong> ${street}</div>
                            <div class="info-item"><strong>Номер дома:</strong> ${number}</div>
                            <div class="info-item"><strong>Количество этажей:</strong> ${floors}</div>
                            <div class="info-item"><strong>Наличие лифта:</strong> ${elevatorCondition}</div>
                        `;

                        // Если лифт есть — выводим размеры в левую панель
                        if (elevatorCondition.toLowerCase().includes('есть')) {
                            html += `<div class="info-item"><strong>Размеры лифта (Ш x Д):</strong> ${elevatorWidth} x ${elevatorLength} см</div>`;
                        }
                        
                        // Проверяем наличие пандуса (если в тексте нет слова "Нет" и он вообще выбран)
                        if (rampsText !== '' && !rampsText.toLowerCase().includes('нет')) {
                            html += `<div class="info-item"><strong>Наличие пандуса:</strong> Да (${rampsText})</div>`;
                            html += `<div class="info-item"><strong>Угол наклона пандуса:</strong> ${rampsDegrees}°</div>`;
                            html += `<div class="info-item"><strong>Длина пандуса:</strong> ${rampsLength} м</div>`;
                            html += `<div class="info-item"><strong>Тип пандуса:</strong> ${rampsType}</div>`;
                        } else {
                            html += `<div class="info-item"><strong>Наличие пандуса:</strong> Нет</div>`;
                        }

                        html += `<div class="info-item"><strong>Доступность:</strong> ${"{{ house.availability|default:'Не указано' }}"}</div>`;
                        
                        // Отправляем собранный HTML в левую панель информации
                        infoContent.innerHTML = html;

                        // ЗАПОЛНЯЕМ ФОРМУ СПРАВА ДЛЯ РЕДАКТИРОВАНИЯ:
                        document.getElementById('sidebar-id').value = "{{ house.id }}";
                        document.getElementById('sidebar-lat').value = "{{ house.latitude }}";
                        document.getElementById('sidebar-lng').value = "{{ house.longitude }}";
                        
                        if(document.getElementById('id_city')) document.getElementById('id_city').value = "{{ house.city.id }}";
                        if(document.getElementById('id_street')) document.getElementById('id_street').value = street;
                        if(document.getElementById('id_number')) document.getElementById('id_number').value = number;
                        if(document.getElementById('id_floors')) document.getElementById('id_floors').value = floors;
                        
                        if(document.getElementById('id_elevator')) document.getElementById('id_elevator').value = "{{ house.elevator.id }}";
                        if(document.getElementById('id_elevator_width')) document.getElementById('id_elevator_width').value = elevatorWidth;
                        if(document.getElementById('id_elevator_length')) document.getElementById('id_elevator_length').value = elevatorLength;
                        
                        // Исправили ID полей под структуру forms.py (убрали лишнюю букву 's' в id_ramp_...)
                        if(document.getElementById('id_ramps')) document.getElementById('id_ramps').value = "{{ house.ramps.id|default:'' }}";
                        if(document.getElementById('id_ramp_degrees')) document.getElementById('id_ramp_degrees').value = rampsDegrees;
                        if(document.getElementById('id_ramp_length')) document.getElementById('id_ramp_length').value = rampsLength;
                        if(document.getElementById('id_ramp_type')) document.getElementById('id_ramp_type').value = rampsType;
                        if(document.getElementById('id_availability')) document.getElementById('id_availability').value = "{{ house.availability.id|default:'' }}";

                        // Принудительно вызываем обновление видимости полей в форме справа
                        toggleElevatorSizes();
                        toggleRampSizes();
                    });
                })();
            {% endif %}
        {% endfor %}
        // =================================================================
        
        // 2. Клик по карте для добавления новой метки
        function onMapClick(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);

            latInput.value = lat;
            lngInput.value = lng;

            if (currentMarker) {
                currentMarker.setLatLng(e.latlng);
            } else {
                currentMarker = L.marker(e.latlng).addTo(map);
            }
        }

        map.on('click', onMapClick);

        // Функция управления видимостью полей размеров лифта
        function toggleElevatorSizes() {
            var elevatorSelect = document.getElementById('id_elevator');
            var widthInput = document.getElementById('id_elevator_width');
            var lengthInput = document.getElementById('id_elevator_length');

            if (!elevatorSelect || !widthInput || !lengthInput) return;

            var selectedText = elevatorSelect.options[elevatorSelect.selectedIndex] ? elevatorSelect.options[elevatorSelect.selectedIndex].text : '';
            var widthContainer = widthInput.closest('p') || widthInput.parentElement;
            var lengthContainer = lengthInput.closest('p') || lengthInput.parentElement;

            if (selectedText.toLowerCase().includes('есть')) {
                widthContainer.style.display = 'block';
                lengthContainer.style.display = 'block';
            } else {
                widthContainer.style.display = 'none';
                lengthContainer.style.display = 'none';
                widthInput.value = '';
                lengthInput.value = '';
            }
        }

        // --- НОВАЯ ФУНКЦИЯ ДЛЯ ДИНАМИЧЕСКОГО СКРЫТИЯ/ПОКАЗА ПОЛЕЙ ПАНДУСА ---
        function toggleRampSizes() {
            var rampsSelect = document.getElementById('id_ramps');
            var degreesInput = document.getElementById('id_ramp_degrees');
            var lengthInput = document.getElementById('id_ramp_length');

            if (!rampsSelect || !degreesInput || !lengthInput) return;

            var selectedText = rampsSelect.options[rampsSelect.selectedIndex] ? rampsSelect.options[rampsSelect.selectedIndex].text : '';
            var degreesContainer = degreesInput.closest('p') || degreesInput.parentElement;
            var lengthContainer = lengthInput.closest('p') || lengthInput.parentElement;

            // Если выбран какой-то пандус и это не вариант "Нет"
            if (rampsSelect.value !== '' && !selectedText.toLowerCase().includes('нет')) {
                degreesContainer.style.display = 'block';
                lengthContainer.style.display = 'block';
            } else {
                // Если пандуса нет — прячем дополнительные поля ввода и очищаем их значения
                degreesContainer.style.display = 'none';
                lengthContainer.style.display = 'none';
                degreesInput.value = '';
                lengthInput.value = '';
            }
        }

        // Навешиваем события при загрузке DOM структуры страницы
        document.addEventListener("DOMContentLoaded", function() {
            // Слушатель для лифта
            var elevatorSelect = document.getElementById('id_elevator');
            if (elevatorSelect) {
                elevatorSelect.addEventListener('change', toggleElevatorSizes);
                toggleElevatorSizes();
            }

            // Слушатель для пандуса
            var rampsSelect = document.getElementById('id_ramps');
            if (rampsSelect) {
                rampsSelect.addEventListener('change', toggleRampSizes);
                toggleRampSizes();
            }
        });

    </script>
</body>
{% endblock content %}
</html>
