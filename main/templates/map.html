<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    
    <link rel="stylesheet" type="text/css" href="{% static 'main/style.css' %}">
    <title>RouteAble Map</title>
</head>

{% block content %}
<body>
    <div class="menubox">
        <div class="logo">RouteAble</div>
        <ul class="menu">
            <li><a href="/">Home</a></li>
            <li><a href="/talk_People/">Community</a></li>
            <li><a href="/map/">Map</a></li>
            <li><a href="/Help_People/">Help</a></li>
            <li><a href="/Contact_People/">Contact</a></li>
        </ul>
    </div>

    <div class="map-layout-container">
        
        <!-- Левая панель: Информация -->
        <div class="sidebar-panel" id="info-panel">
            <h3>Информация об объекте</h3>
            <div id="info-content" class="info-panel-content">
                <p class="info-panel-placeholder">
                    Выберите маркер на карте, чтобы увидеть информацию о доме.
                </p>
            </div>
        </div>
        
        <!-- Карта -->
        <div id="map"></div>

        <!-- Правая панель: Форма -->
        <div class="sidebar-panel">
            <h3 id="form-title">Добавить дом</h3>
            <form method="post">
                {% csrf_token %}
                
                <input type="hidden" id="sidebar-id" name="house_id" value="">
                <input type="hidden" id="sidebar-lat" name="latitude" value="" required>
                <input type="hidden" id="sidebar-lng" name="longitude" value="" required>
                
                <div class="django-sidebar-form">
                    {{ form }}
                </div>
                
                <input type="submit" value="Сохранить" class="submit-btn">
            </form>
        </div>

    </div>

    <script>
        // 1. Инициализация карты (Новосибирск)
        var map = L.map('map').setView([55.030206, 82.920419], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var currentMarker = null;
        var latInput = document.getElementById('sidebar-lat');
        var lngInput = document.getElementById('sidebar-lng');
        var infoContent = document.getElementById('info-content');

        // Вспомогательная функция для записи значений в элементы формы
        function setInputValue(id, val) {
            var el = document.getElementById(id);
            if (el) {
                if (el.type === 'checkbox') {
                    el.checked = Boolean(val);
                } else {
                    el.value = (val !== undefined && val !== null) ? val : '';
                }
                return true;
            }
            return false;
        }

        // Переключение видимости размеров лифта (чекбокс id_has_elevator)
        function toggleElevatorSizes() {
            var checkbox = document.getElementById('id_has_elevator');
            var widthInput = document.getElementById('id_elevator_width');
            var lengthInput = document.getElementById('id_elevator_length');

            if (!widthInput || !lengthInput) return;

            var widthContainer = widthInput.closest('p') || widthInput.parentElement;
            var lengthContainer = lengthInput.closest('p') || lengthInput.parentElement;

            if (checkbox && checkbox.checked) {
                if (widthContainer) widthContainer.style.display = 'block';
                if (lengthContainer) lengthContainer.style.display = 'block';
            } else {
                if (widthContainer) widthContainer.style.display = 'none';
                if (lengthContainer) lengthContainer.style.display = 'none';
            }
        }

        // Переключение видимости размеров пандуса (чекбокс id_has_ramp)
        function toggleRampSizes() {
            var checkbox = document.getElementById('id_has_ramp');
            var degreesInput = document.getElementById('id_ramp_degrees');
            var lengthInput = document.getElementById('id_ramp_length');

            if (!degreesInput || !lengthInput) return;

            var degreesContainer = degreesInput.closest('p') || degreesInput.parentElement;
            var lengthContainer = lengthInput.closest('p') || lengthInput.parentElement;

            if (checkbox && checkbox.checked) {
                if (degreesContainer) degreesContainer.style.display = 'block';
                if (lengthContainer) lengthContainer.style.display = 'block';
            } else {
                if (degreesContainer) degreesContainer.style.display = 'none';
                if (lengthContainer) lengthContainer.style.display = 'none';
            }
        }

        // Очистка формы при создании нового объекта
        function resetForm() {
            var formTitle = document.getElementById('form-title');
            if (formTitle) formTitle.innerText = 'Добавить дом';

            setInputValue('sidebar-id', '');
            setInputValue('id_city', '');
            setInputValue('id_street', '');
            setInputValue('id_number', '');
            setInputValue('id_floors', '');
            
            setInputValue('id_has_elevator', false);
            setInputValue('id_elevator_width', '');
            setInputValue('id_elevator_length', '');
            
            setInputValue('id_has_ramp', false);
            setInputValue('id_ramp_degrees', '');
            setInputValue('id_ramp_length', '');

            var availabilitySelect = document.getElementById('id_availability');
            if (availabilitySelect) availabilitySelect.selectedIndex = 0;

            toggleElevatorSizes();
            toggleRampSizes();

            if (infoContent) {
                infoContent.innerHTML = `
                    <p class="info-panel-placeholder">
                        Кликните по карте или заполните форму справа, чтобы добавить дом.
                    </p>
                `;
            }
        }

        // Автоматическое определение адреса через OSM Nominatim
        function fetchAddress(lat, lng) {
            var url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ru`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.address) {
                        var addr = data.address;
                        var cityName = addr.city || addr.town || addr.village || addr.hamlet || addr.county || '';
                        var streetName = addr.road || addr.pedestrian || addr.suburb || '';
                        var houseNumber = addr.house_number || '';

                        setInputValue('id_city', cityName);
                        setInputValue('id_street', streetName);
                        setInputValue('id_number', houseNumber);
                    }
                })
                .catch(err => console.error('Ошибка определения адреса:', err));
        }

        // Клик по карте для добавления новой точки
        function onMapClick(e) {
            resetForm();

            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);

            if (latInput) latInput.value = lat;
            if (lngInput) lngInput.value = lng;

            if (currentMarker) {
                currentMarker.setLatLng(e.latlng);
            } else {
                currentMarker = L.marker(e.latlng).addTo(map);
            }

            fetchAddress(lat, lng);
        }

        map.on('click', onMapClick);

        // =================================================================
        // ЗАГРУЗКА И ОТОБРАЖЕНИЕ МАРКЕРОВ
        // =================================================================
        function loadHousesFromAPI() {
            fetch('/api/v1/houses/')
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сети при запросе к API');
                    return response.json();
                })
                .then(data => {
                    var houses = data.results ? data.results : data;

                    houses.forEach(house => {
                        if (house.latitude && house.longitude) {
                            var marker = L.marker([house.latitude, house.longitude]).addTo(map);
                            
                            marker.on('click', function(e) {
                                if (e && e.originalEvent) {
                                    e.originalEvent.stopPropagation();
                                }

                                document.getElementById('form-title').innerText = 'Редактировать дом (ID: ' + house.id + ')';
                                
                                setInputValue('sidebar-id', house.id);
                                setInputValue('sidebar-lat', house.latitude);
                                setInputValue('sidebar-lng', house.longitude);
                                
                                setInputValue('id_city', house.city || '');
                                setInputValue('id_street', house.street || '');
                                setInputValue('id_number', house.number || '');
                                setInputValue('id_floors', house.floors || '');
                                
                                // Устанавливаем данные лифта
                                setInputValue('id_has_elevator', house.has_elevator);
                                setInputValue('id_elevator_width', house.elevator_width);
                                setInputValue('id_elevator_length', house.elevator_length);
                                
                                // Устанавливаем данные пандуса
                                setInputValue('id_has_ramp', house.has_ramp);
                                setInputValue('id_ramp_degrees', house.ramp_degrees);
                                setInputValue('id_ramp_length', house.ramp_length);
                                
                                // Доступность
                                var availabilityId = house.availability ? house.availability.id : '';
                                setInputValue('id_availability', availabilityId);

                                // Переключаем отображение полей ввода в форме
                                toggleElevatorSizes();
                                toggleRampSizes();

                                // Рендерим блок "Информация об объекте"
                                var cityName = house.city || 'Не указан';
                                var elevatorStatus = house.has_elevator ? 'Есть' : 'Нет';
                                var rampStatus = house.has_ramp ? 'Есть' : 'Нет';
                                
                                var availabilityText = 'Не указано';
                                if (house.availability) {
                                    availabilityText = house.availability.assistance ? "Доступен с помощью" : "Недоступен";
                                }

                                var html = `
                                    <div class="info-item"><strong>ГОРОД:</strong> ${cityName}</div>
                                    <div class="info-item"><strong>УЛИЦА:</strong> ${house.street || ''}</div>
                                    <div class="info-item"><strong>НОМЕР ДОМА:</strong> ${house.number || ''}</div>
                                    <div class="info-item"><strong>ЭТАЖИ:</strong> ${house.floors || ''}</div>
                                    <div class="info-item"><strong>НАЛИЧИЕ ЛИФТА:</strong> ${elevatorStatus}</div>
                                `;

                                if (house.has_elevator) {
                                    html += `<div class="info-item"><strong>РАЗМЕРЫ ЛИФТА (Ш X Д):</strong> ${house.elevator_width || 0} x ${house.elevator_length || 0} см</div>`;
                                }
                                
                                html += `<div class="info-item"><strong>НАЛИЧИЕ ПАНДУСА:</strong> ${rampStatus}</div>`;
                                
                                if (house.has_ramp) {
                                    html += `<div class="info-item"><strong>УГОЛ НАКЛОНА ПАНДУСА:</strong> ${house.ramp_degrees || 0}°</div>`;
                                    html += `<div class="info-item"><strong>ДЛИНА ПАНДУСА:</strong> ${house.ramp_length || 0} м</div>`;
                                }

                                html += `<div class="info-item"><strong>ДОСТУПНОСТЬ:</strong> ${availabilityText}</div>`;
                                
                                infoContent.innerHTML = html;
                            });
                        }
                    });
                })
                .catch(error => console.error('Ошибка работы AJAX-запроса:', error));
        }

        loadHousesFromAPI();

        // Привязка событий переключения полей к чекбоксам
        document.addEventListener("DOMContentLoaded", function() {
            var elevatorCheckbox = document.getElementById('id_has_elevator');
            if (elevatorCheckbox) {
                elevatorCheckbox.addEventListener('change', toggleElevatorSizes);
            }

            var rampCheckbox = document.getElementById('id_has_ramp');
            if (rampCheckbox) {
                rampCheckbox.addEventListener('change', toggleRampSizes);
            }

            toggleElevatorSizes();
            toggleRampSizes();
        });
    </script>
</body>
{% endblock content %}
</html>
