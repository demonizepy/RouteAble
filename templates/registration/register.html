<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; padding: 24px; border: 1px solid #ddd; border-radius: 12px;">
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
</body>
</html>
